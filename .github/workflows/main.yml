name: Deploy to AWS Lambda

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR Repository Exists
        env:
          ECR_REPOSITORY: your-repository-name  # Replace with your desired repository name
        run: |
          if ! aws ecr describe-repositories --repository-names $ECR_REPOSITORY > /dev/null 2>&1; then
            echo "Repository $ECR_REPOSITORY does not exist. Creating it now."
            aws ecr create-repository --repository-name $ECR_REPOSITORY
          else
            echo "Repository $ECR_REPOSITORY already exists."
          fi

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: your-repository-name  # Replace with your actual repository name
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install zappa
          pip install httplib2==0.22.0
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Update zappa_settings.json with environment variables
        run: |
          envsubst < zappa_settings.json > zappa_settings_tmp.json
          mv zappa_settings_tmp.json zappa_settings.json
        env:
          MONGODB_ATLAS_CLUSTER_URI: ${{ secrets.MONGODB_ATLAS_CLUSTER_URI }}
          DB_NAME: ${{ secrets.DB_NAME }}

      - name: Deploy to Lambda
        run: |
          source venv/bin/activate
          if zappa status main > /dev/null 2>&1; then
            echo "Application already deployed. Running zappa update."
            zappa update main
          else
            echo "Application not found. Running zappa deploy."
            zappa deploy main
          fi
