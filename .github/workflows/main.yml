name: Build, Deploy to ECR, and Update Lambda

on:
  push:
    branches:
      - main  # Trigger on pushes to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # Checkout code
    - name: Checkout code
      uses: actions/checkout@v3

    # Configure AWS credentials
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-southeast-1

    # Log in to Amazon ECR
    - name: Log in to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    # Ensure ECR repository exists
    - name: Ensure ECR repository exists
      run: |
        ecr_repo="flask-app"
        # Check if the repository exists
        if ! aws ecr describe-repositories --repository-names $ecr_repo > /dev/null 2>&1; then
          echo "ECR repository $ecr_repo does not exist. Creating..."
          aws ecr create-repository --repository-name $ecr_repo
        else
          echo "ECR repository $ecr_repo already exists."
        fi

    # Build the Docker image
    - name: Build Docker image
      run: |
        ecr_repo="flask-app"
        image_tag="latest"
        # Build the Docker image
        docker build -t $ecr_repo:$image_tag .
        # Tag the Docker image for ECR
        aws_account_id=$(aws sts get-caller-identity --query Account --output text)
        docker tag $ecr_repo:$image_tag $aws_account_id.dkr.ecr.ap-southeast-1.amazonaws.com/$ecr_repo:$image_tag

    # Push the Docker image to ECR
    - name: Push Docker image to ECR
      run: |
        ecr_repo="flask-app"
        image_tag="latest"
        aws_account_id=$(aws sts get-caller-identity --query Account --output text)
        # Push the Docker image to ECR
        docker push $aws_account_id.dkr.ecr.ap-southeast-1.amazonaws.com/$ecr_repo:$image_tag

    # Check if Lambda function exists, create if not
    - name: Check if Lambda function exists, create if not
      run: |
        lambda_function_name="inference"
        # Check if Lambda function exists
        if ! aws lambda get-function --function-name $lambda_function_name > /dev/null 2>&1; then
          echo "Lambda function $lambda_function_name does not exist. Creating..."
          
          # Get the AWS account ID dynamically
          aws_account_id=$(aws sts get-caller-identity --query Account --output text)
          
          # Create the Lambda function using the ECR image
          aws lambda create-function \
            --function-name $lambda_function_name \
            --package-type Image \
            --code ImageUri=$ecr_image_uri \
            --role arn:aws:iam::$aws_account_id:role/lambda-role \
            --timeout 15
        else
          echo "Lambda function $lambda_function_name already exists."
        fi

    # Update the Lambda function
    - name: Update Lambda function
      run: |
        ecr_repo="flask-app"
        image_tag="latest"
        aws_account_id=$(aws sts get-caller-identity --query Account --output text)
        ecr_image_uri="$aws_account_id.dkr.ecr.ap-southeast-1.amazonaws.com/$ecr_repo:$image_tag"
        lambda_function_name="inference"
        echo "Updating Lambda function $lambda_function_name to use image $ecr_image_uri"
        # Update the Lambda function to use the new ECR image
        aws lambda update-function-code \
          --function-name $lambda_function_name \
          --image-uri $ecr_image_uri
