name: Deploy Flask App

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
        with:
          region: ${{ secrets.AWS_REGION }}

      - name: Build, tag, and push Docker image
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws_account_id=$(aws sts get-caller-identity --query "Account" --output text)
          repository_name=flask-app
          image_tag=latest

          # Create ECR Repository if it doesn't exist
          aws ecr describe-repositories --repository-names $repository_name || \
          aws ecr create-repository --repository-name $repository_name

          # Build, Tag, and Push the Image
          docker build -t $repository_name .
          docker tag $repository_name:latest $aws_account_id.dkr.ecr.$AWS_REGION.amazonaws.com/$repository_name:$image_tag
          docker push $aws_account_id.dkr.ecr.$AWS_REGION.amazonaws.com/$repository_name:$image_tag

  deploy-to-lambda:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy to AWS Lambda
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws_account_id=$(aws sts get-caller-identity --query "Account" --output text)
          repository_name=flask-app
          image_tag=latest
          image_uri=$aws_account_id.dkr.ecr.$AWS_REGION.amazonaws.com/$repository_name:$image_tag

          # Create Lambda Function if not exists
          function_name=flask-app-lambda
          aws lambda get-function --function-name $function_name || \
          aws lambda create-function \
            --function-name $function_name \
            --role arn:aws:iam::<your-role-arn> \
            --code ImageUri=$image_uri \
            --package-type Image \
            --timeout 30 \
            --memory-size 512

          # Update Lambda Function
          aws lambda update-function-code \
            --function-name $function_name \
            --image-uri $image_uri
