name: Build and Push Docker Image to ECR

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR Repository Exists
        run: |
          if ! aws ecr describe-repositories --repository-names example > /dev/null 2>&1; then
            echo "Repository example does not exist. Creating it now."
            aws ecr create-repository --repository-name example
          else
            echo "Repository example already exists."
          fi

      - name: Build, tag, and push image to Amazon ECR
        run: |
          docker build -t 123456789012.dkr.ecr.ap-southeast-1.amazonaws.com/example:latest .
          docker push 123456789012.dkr.ecr.ap-southeast-1.amazonaws.com/example:latest
          
      - name: Check if Lambda Function Exists
        id: check-lambda
        run: |
          if aws lambda get-function --function-name my-lambda-function > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_ENV
          else
            echo "exists=false" >> $GITHUB_ENV
          fi

      - name: Create or Update Lambda Function
        run: |
          if [[ "$exists" == "true" ]]; then
            echo "Updating existing Lambda function..."
            aws lambda update-function-code \
              --function-name my-lambda-function \
              --image-uri 123456789012.dkr.ecr.ap-southeast-1.amazonaws.com/example:latest
          else
            echo "Creating new Lambda function..."
            aws lambda create-function \
              --function-name my-lambda-function \
              --package-type Image \
              --code ImageUri=123456789012.dkr.ecr.ap-southeast-1.amazonaws.com/example:latest \
              --role arn:aws:iam::123456789012:role/service-role/my-lambda-role
          fi