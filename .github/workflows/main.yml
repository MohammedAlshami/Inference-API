name: Build, Push to ECR, and Deploy with Terraform

on:
  push:
    branches:
      - main  # Trigger on pushes to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # Log in to Amazon ECR
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
        with:
          aws-region: ap-southeast-1

      # Build and push the Docker image to ECR
      - name: Build and Push Docker Image
        run: |
          ecr_repo="flask-app"
          image_tag="latest"
          aws_account_id=$(aws sts get-caller-identity --query Account --output text)
          
          # Build Docker image
          docker build -t $ecr_repo:$image_tag .

          # Tag Docker image for ECR
          docker tag $ecr_repo:$image_tag $aws_account_id.dkr.ecr.ap-southeast-1.amazonaws.com/$ecr_repo:$image_tag

          # Push to ECR
          docker push $aws_account_id.dkr.ecr.ap-southeast-1.amazonaws.com/$ecr_repo:$image_tag

      # Deploy with Terraform
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0  # Replace with your preferred version

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve \
            -var="ecr_image_uri=$aws_account_id.dkr.ecr.ap-southeast-1.amazonaws.com/$ecr_repo:$image_tag"
