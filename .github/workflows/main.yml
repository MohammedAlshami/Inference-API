name: Deploy Example

on:
  push:
    branches:
      - main

jobs:
  deploy-example:
    name: Deploy Blog Example
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: example
          IMAGE_TAG: latest
        run: |
          docker build -t example .
          docker tag example:latest ${{ secrets.AWS_ACCOUNT_NUM }}.dkr.ecr.ap-southeast-1.amazonaws.com/example:latest
          docker push ${{ secrets.AWS_ACCOUNT_NUM }}.dkr.ecr.ap-southeast-1.amazonaws.com/example:latest
          aws lambda update-function-code --function-name example-lambda --image-uri ${{ secrets.AWS_ACCOUNT_NUM }}.dkr.ecr.ap-southeast-1.amazonaws.com/example:latest
