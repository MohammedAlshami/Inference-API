name: Deploy to AWS Lambda

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/your-repo-name:latest,${{ secrets.DOCKERHUB_USERNAME }}/your-repo-name:${{ github.sha }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install zappa
          pip install httplib2==0.22.0
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Update zappa_settings.json with environment variables
        run: |
          envsubst < zappa_settings.json > zappa_settings_tmp.json
          mv zappa_settings_tmp.json zappa_settings.json
        env:
          MONGODB_ATLAS_CLUSTER_URI: ${{ secrets.MONGODB_ATLAS_CLUSTER_URI }}
          DB_NAME: ${{ secrets.DB_NAME }}

      - name: Deploy to Lambda
        run: |
          source venv/bin/activate
          if zappa status main > /dev/null 2>&1; then
            echo "Application already deployed. Running zappa update."
            zappa update main
          else
            echo "Application not found. Running zappa deploy."
            zappa deploy main
          fi
